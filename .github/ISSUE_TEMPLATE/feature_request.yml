name: Feature request
description: Something you want archituner to show or do that it does not yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: question
    attributes:
      label: 1. What you want to know or do
      description: "The question about your project you cannot answer today. Example: which floors changed most since last month?"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: 2. How you handle it today
      description: A workaround, another tool, or nothing.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 3. Anything else (optional)
      description: A sketch, a link, an example project.
